name: CI

on:
  push:
    branches: [main, master, dio]
  pull_request:
    branches: [main, master, dio]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes com cobertura
        run: npm run test:ci
        env:
          CI: true

      - name: Publicar relatório de testes (JUnit)
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v1
        with:
          name: Vitest (Node ${{ matrix.node }})
          path: reports/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload de cobertura e relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-node-${{ matrix.node }}
          path: |
            coverage/
            reports/
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: Smoke test da API
    runs-on: ubuntu-latest
    needs: testes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Subir a API e validar /health
        run: |
          node src/index.js > server.log 2>&1 &
          SERVER_PID=$!

          for tentativa in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "API respondeu na tentativa ${tentativa}"
              break
            fi
            sleep 1
          done

          curl --fail --show-error http://localhost:3000/health
          kill "$SERVER_PID"

      - name: Mostrar log do servidor em caso de falha
        if: failure()
        run: cat server.log
